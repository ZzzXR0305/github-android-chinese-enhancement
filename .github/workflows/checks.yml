name: Check patch source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android compile platform
        run: test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
      - name: Check DOM translation
        run: node tests/check-immersive.js
      - name: Check Python patch planning
        run: python -m unittest discover -s tools/updates/tests
      - name: Compile and check Java logic
        run: |
          mkdir -p .work/classes
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          javac --release 8 -encoding UTF-8 -cp "$android_jar" -d .work/classes payload/src/cn/local/githubcn/*.java tests/*.java helper/app/src/main/java/cn/local/repochinese/TextTools.java
          for check in SearchQueryCheck NativeTextCheck PageStayCheck UpdateVersionCheck LanguageOptionsCheck; do
            java -ea -cp ".work/classes:$android_jar" "cn.local.githubcn.$check"
          done
          java -ea -cp .work/classes cn.local.repochinese.TextToolsCheck
